<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}Anthony Eckmann{% else %}{{ page.title }} — Anthony Eckmann{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="Anthony Eckmann">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{% if page.url == "/" %}Anthony Eckmann{% else %}{{ page.title }} — Anthony Eckmann{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <div class="identity">
        {% if page.url == "/" %}
          <h1 class="wordmark">Anthony Eckmann</h1>
        {% else %}
          <a class="wordmark" href="{{ '/' | relative_url }}">Anthony Eckmann</a>
        {% endif %}
        <p class="role">Machine learning engineer</p>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == "/about/" %}aria-current="page"{% endif %}>About</a>
      </nav>
    </header>

    <main id="content" class="prose{% if page.url == '/' %} prose-home{% endif %}">
      {% if page.layout == "page" %}
        <h1 class="kicker">{{ page.title }}</h1>
      {% endif %}
      {{ content }}
    </main>

    <footer class="site-footer">
      <a href="https://github.com/aecki">GitHub</a>
      <a href="https://www.anthonyeckmann.ch">Photography</a>
      <a href="{{ '/about/#contact' | relative_url }}">Contact</a>
    </footer>
  </div>
</body>
</html>
